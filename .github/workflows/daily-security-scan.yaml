name: Daily security scan

on:
  pull_request:
    branches:
      - main
      - backplane-2.11
      - backplane-2.17
      - 'release-*'
  schedule:
    # Scan every maintained branch daily.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional pull request number to scan."
        required: false
        type: number
      base_branch:
        description: "Base branch of the pull request being scanned."
        required: false
        type: string

permissions: {}

jobs:
  scan:
    permissions:
      contents: read
      id-token: write
      security-events: write
    concurrency:
      group: daily-security-scan-${{ matrix.branch }}-${{ (github.event_name == 'pull_request' && github.event.pull_request.number) || (github.event_name == 'workflow_dispatch' && inputs.pr_number) || 'branch' }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # Keep this list aligned with docs/branch-sync-policy.md and govulncheck.yaml.
        branch: ${{ fromJSON(github.event_name == 'schedule' && '["main","backplane-2.11","backplane-2.17","backplane-5.0","backplane-5.1","backplane-5.2","release-2.13","release-2.18","release-2.19"]' || format('[{0}]', toJSON((github.event_name == 'pull_request' && github.base_ref) || (github.event_name == 'workflow_dispatch' && inputs.pr_number && inputs.base_branch) || github.ref_name))) }}
    name: Trivy (${{ matrix.branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out code
      uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231 # pinned to 6.0.2
      with:
        ref: ${{ (github.event_name == 'pull_request' && github.sha) || (github.event_name == 'workflow_dispatch' && inputs.pr_number && format('refs/pull/{0}/merge', inputs.pr_number)) || matrix.branch }}
        persist-credentials: false

    - name: Install cosign
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.pr_number
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Check for openpgp imports
      run: |
        grep_status=0
        grep_output=$(grep -rn -E '^\s*(import\s+)?([A-Za-z_.][A-Za-z0-9_]*\s+)?"golang\.org/x/crypto/openpgp' --include="*.go" . 2>&1) || grep_status=$?
        if [ "$grep_status" -gt 1 ]; then
          echo "::error::Failed to scan Go files for openpgp imports."
          echo "$grep_output" >&2
          exit 1
        elif [ "$grep_status" -eq 0 ]; then
          echo "::error::Found import of golang.org/x/crypto/openpgp (unmaintained, GO-2026-5932). Migrate to github.com/ProtonMail/go-crypto/openpgp."
          echo "$grep_output"
          exit 1
        fi

    - name: Capture scanned commit
      id: scanned-commit
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Run Trivy vulnerability scanner in repo mode
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM,LOW'
        exit-code: '1'
      continue-on-error: true
      id: trivy-scan

    - name: Run Trivy for human-readable output
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        output: 'trivy-results.txt'
        severity: 'CRITICAL,HIGH,MEDIUM,LOW'
      continue-on-error: true
      id: trivy-table

    - name: Validate scan output
      if: always()
      id: validate-sarif
      run: |
        if [ ! -s trivy-results.sarif ]; then
          echo "::error::Trivy scan did not produce SARIF output. The scan may have failed due to infrastructure issues."
          exit 1
        fi
        if ! jq empty trivy-results.sarif 2>/dev/null; then
          echo "::error::trivy-results.sarif is not valid JSON. Scan results may be corrupted."
          exit 1
        fi

    - name: Count vulnerabilities from SARIF
      if: always() && steps.validate-sarif.outcome == 'success'
      id: vuln-counts
      run: |
        CRITICAL=$(jq '[.runs[] | . as $run | ($run.tool.driver.rules // []) as $rules | ($run.results // [])[] | $rules[.ruleIndex] | select(.properties.tags[]? == "CRITICAL")] | length' trivy-results.sarif 2>/dev/null || echo 0)
        HIGH=$(jq '[.runs[] | . as $run | ($run.tool.driver.rules // []) as $rules | ($run.results // [])[] | $rules[.ruleIndex] | select(.properties.tags[]? == "HIGH")] | length' trivy-results.sarif 2>/dev/null || echo 0)
        MEDIUM=$(jq '[.runs[] | . as $run | ($run.tool.driver.rules // []) as $rules | ($run.results // [])[] | $rules[.ruleIndex] | select(.properties.tags[]? == "MEDIUM")] | length' trivy-results.sarif 2>/dev/null || echo 0)
        LOW=$(jq '[.runs[] | . as $run | ($run.tool.driver.rules // []) as $rules | ($run.results // [])[] | $rules[.ruleIndex] | select(.properties.tags[]? == "LOW")] | length' trivy-results.sarif 2>/dev/null || echo 0)
        UNKNOWN=$(jq '[.runs[] | . as $run | ($run.tool.driver.rules // []) as $rules | ($run.results // [])[] | $rules[.ruleIndex] | select(.properties.tags[]? == "UNKNOWN")] | length' trivy-results.sarif 2>/dev/null || echo 0)

        for var in CRITICAL HIGH MEDIUM LOW UNKNOWN; do
          val="${!var}"
          if ! echo "$val" | grep -qE '^[0-9]+$'; then
            echo "::warning::$var count is not a valid integer ('$val'). Defaulting to 0."
            declare "$var=0"
          fi
        done

        TOTAL=$((CRITICAL + HIGH + MEDIUM + LOW + UNKNOWN))

        if [ "$TOTAL" -eq 0 ] && [ "${{ steps.trivy-scan.outcome }}" = "failure" ]; then
          echo "::warning::Trivy reported vulnerabilities (exit code 1) but SARIF parsing found 0. The SARIF schema may have changed. Check trivy-results.sarif in the uploaded artifacts."
        fi

        echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
        echo "high=$HIGH" >> "$GITHUB_OUTPUT"
        echo "medium=$MEDIUM" >> "$GITHUB_OUTPUT"
        echo "low=$LOW" >> "$GITHUB_OUTPUT"
        echo "unknown=$UNKNOWN" >> "$GITHUB_OUTPUT"
        echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

    - name: Generate summary
      if: always()
      env:
        CRITICAL: ${{ steps.vuln-counts.outputs.critical }}
        HIGH: ${{ steps.vuln-counts.outputs.high }}
        MEDIUM: ${{ steps.vuln-counts.outputs.medium }}
        LOW: ${{ steps.vuln-counts.outputs.low }}
        UNKNOWN: ${{ steps.vuln-counts.outputs.unknown }}
        TOTAL: ${{ steps.vuln-counts.outputs.total }}
      run: |
        echo "# Trivy Security Scan Results (${{ matrix.branch }})" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"

        if [ -z "$TOTAL" ]; then
          echo "## ⚠️ Vulnerability counts unavailable" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The SARIF parsing step did not produce counts. Check workflow logs for details." >> "$GITHUB_STEP_SUMMARY"
        elif [ "$TOTAL" = "0" ]; then
          echo "## ✅ No vulnerabilities found!" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch \`${{ matrix.branch }}\` passed all Trivy security checks." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "## ❌ Vulnerabilities detected: $TOTAL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Severity | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔴 CRITICAL | $CRITICAL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🟠 HIGH | $HIGH |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🟡 MEDIUM | $MEDIUM |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🟢 LOW | $LOW |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ⚪ UNKNOWN | $UNKNOWN |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f trivy-results.txt ]; then
            echo "### Scan Results" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat trivy-results.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Note:** Detailed scan output is unavailable. The human-readable scan step may have failed. Check workflow logs." >> "$GITHUB_STEP_SUMMARY"
          fi
        fi

    - name: Save scan counts for issue reporting
      if: always()
      env:
        CRITICAL: ${{ steps.vuln-counts.outputs.critical }}
        HIGH: ${{ steps.vuln-counts.outputs.high }}
        MEDIUM: ${{ steps.vuln-counts.outputs.medium }}
        LOW: ${{ steps.vuln-counts.outputs.low }}
        UNKNOWN: ${{ steps.vuln-counts.outputs.unknown }}
        TOTAL: ${{ steps.vuln-counts.outputs.total }}
      run: |
        jq -n \
          --arg critical "$CRITICAL" \
          --arg high "$HIGH" \
          --arg medium "$MEDIUM" \
          --arg low "$LOW" \
          --arg unknown "$UNKNOWN" \
          --arg total "$TOTAL" \
          '{critical:$critical,high:$high,medium:$medium,low:$low,unknown:$unknown,total:$total}' \
          > scan-summary.json

    - name: Sign scan summary
      if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.pr_number && hashFiles('scan-summary.json') != ''
      run: |
        cosign sign-blob \
          --yes \
          --bundle scan-summary.sigstore.json \
          scan-summary.json

    - name: Upload Trivy results (SARIF)
      if: always()
      id: upload-sarif
      uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy-${{ matrix.branch }}'
        ref: ${{ (github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number)) || (github.event_name == 'workflow_dispatch' && inputs.pr_number && format('refs/pull/{0}/merge', inputs.pr_number)) || format('refs/heads/{0}', matrix.branch) }}
        sha: ${{ steps.scanned-commit.outputs.sha }}
      continue-on-error: true

    - name: Warn on SARIF upload failure
      if: always() && steps.upload-sarif.outcome == 'failure'
      run: |
        echo "::warning::Failed to upload SARIF results to the Security tab. Results are still available in the workflow artifacts."

    - name: Upload Trivy results (artifact)
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: trivy-results-${{ matrix.branch }}
        path: |
          trivy-results.sarif
          trivy-results.txt
          scan-summary.json
          scan-summary.sigstore.json
        retention-days: 30

    - name: Fail if vulnerabilities found
      if: steps.trivy-scan.outcome == 'failure'
      run: exit 1

  create-issues:
    needs: scan
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.pr_number
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
    - name: Download scan artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: trivy-results-*
        path: trivy-artifacts
        merge-multiple: false
      continue-on-error: true

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Verify scan summary signatures
      env:
        CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
      run: |
        shopt -s nullglob
        summaries=(trivy-artifacts/trivy-results-*/scan-summary.json)
        for summary in "${summaries[@]}"; do
          if ! cosign verify-blob \
            --bundle "${summary%.json}.sigstore.json" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$summary"; then
            echo "::error::Signature verification failed for $summary; skipping issue reporting for this branch."
            rm -f "$summary"
          fi
        done

    - name: Create or update security issues
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        SERVER_URL: ${{ github.server_url }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
      run: |
        shopt -s nullglob
        for RESULTS_DIR in trivy-artifacts/trivy-results-*; do
          SUMMARY_FILE="$RESULTS_DIR/scan-summary.json"
          if [ ! -s "$SUMMARY_FILE" ]; then
            echo "::warning::Scan summary is missing for $RESULTS_DIR; skipping issue creation."
            continue
          fi

          BRANCH="${RESULTS_DIR#trivy-artifacts/trivy-results-}"
          CRITICAL=$(jq -r '.critical // empty' "$SUMMARY_FILE")
          HIGH=$(jq -r '.high // empty' "$SUMMARY_FILE")
          MEDIUM=$(jq -r '.medium // empty' "$SUMMARY_FILE")
          LOW=$(jq -r '.low // empty' "$SUMMARY_FILE")
          UNKNOWN=$(jq -r '.unknown // empty' "$SUMMARY_FILE")
          TOTAL=$(jq -r '.total // empty' "$SUMMARY_FILE")

          if ! [[ "$TOTAL" =~ ^[0-9]+$ ]]; then
            echo "::warning::Vulnerability count is missing or invalid for $BRANCH; skipping issue creation."
            continue
          fi
          if [ "$TOTAL" -eq 0 ]; then
            continue
          fi

          EXISTING_ISSUE=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --search "in:title \"[Trivy]\" \"$BRANCH\"" \
            --json number \
            --jq '.[0].number // empty') || {
            echo "::warning::Failed to check for existing issues. A duplicate issue may be created."
            EXISTING_ISSUE=""
          }

          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Existing issue found: #$EXISTING_ISSUE"

            {
              echo "## 🔄 Vulnerabilities Still Present"
              echo ""
              echo "**New Detection**: ${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
              echo "**Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
              echo "**Branch**: ${BRANCH}"
              echo ""
              echo "### Current Vulnerability Count"
              echo ""
              echo "| Severity | Count |"
              echo "|----------|-------|"
              echo "| 🔴 CRITICAL | $CRITICAL |"
              echo "| 🟠 HIGH | $HIGH |"
              echo "| 🟡 MEDIUM | $MEDIUM |"
              echo "| 🟢 LOW | $LOW |"
              echo "| ⚪ UNKNOWN | $UNKNOWN |"
              echo "| **TOTAL** | **$TOTAL** |"
              echo ""
              echo "### Latest Scan Results"
              echo ""
              echo "<details>"
              echo "<summary>Click to expand Trivy scan output</summary>"
              echo ""
              echo '```'
              cat "$RESULTS_DIR/trivy-results.txt" 2>/dev/null | head -200 || echo "See workflow logs for full details"
              echo '```'
              echo ""
              echo "</details>"
              echo ""
              echo "**Security Tab**: Check the [Security tab](${SERVER_URL}/${REPO}/security/code-scanning) for detailed SARIF results."
            } > comment_body.md

            gh issue comment "$EXISTING_ISSUE" --body-file comment_body.md || {
              echo "::warning::Failed to update existing issue #$EXISTING_ISSUE with new scan results."
            }
          else
            echo "Creating new issue..."

            {
              echo "# 🚨 Security Alert: Vulnerabilities Detected (Trivy)"
              echo ""
              echo "## Overview"
              echo ""
              echo "The **Trivy** security scanner has detected vulnerabilities on branch \`${BRANCH}\`."
              echo ""
              echo "| Field | Value |"
              echo "|-------|-------|"
              echo "| **Scanner** | Trivy |"
              echo "| **Branch** | \`${BRANCH}\` |"
              echo "| **🔴 CRITICAL** | $CRITICAL |"
              echo "| **🟠 HIGH** | $HIGH |"
              echo "| **🟡 MEDIUM** | $MEDIUM |"
              echo "| **🟢 LOW** | $LOW |"
              echo "| **⚪ UNKNOWN** | $UNKNOWN |"
              echo "| **TOTAL** | **$TOTAL** |"
              echo "| **Workflow Run** | [${RUN_ID}](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}) |"
              echo "| **Date** | $(date -u +"%Y-%m-%d %H:%M:%S UTC") |"
              echo ""
              echo "## 📋 Scan Results"
              echo ""
              echo "🔒 **SARIF Results**: [View in Security Tab](${SERVER_URL}/${REPO}/security/code-scanning)"
              echo ""
              echo "<details open>"
              echo "<summary><b>Trivy Findings</b></summary>"
              echo ""
              echo '```'
              cat "$RESULTS_DIR/trivy-results.txt" 2>/dev/null | head -200 || echo "See workflow run logs for complete details"
              echo '```'
              echo ""
              echo "</details>"
              echo ""
              echo "## 🔧 Remediation"
              echo ""
              echo "1. **Prioritize** by severity: CRITICAL → HIGH → MEDIUM → LOW"
              echo "2. **Update** vulnerable dependencies: \`go get -u <package>@<safe-version> && go mod tidy\`"
              echo "3. **Test** changes: \`make test\`"
              echo "4. **Verify** locally: \`docker run --rm -v \$(pwd):/scan aquasec/trivy fs /scan\`"
              echo ""
              echo "---"
              echo ""
              echo "*🤖 This issue was automatically created by the [security scan workflow](${SERVER_URL}/${REPO}/actions/workflows/daily-security-scan.yaml)*"
            } > issue_body.md

            gh issue create \
              --title "🚨 [Trivy] Vulnerabilities detected on ${BRANCH}" \
              --body-file issue_body.md || {
              echo "::warning::Failed to create GitHub issue for security vulnerabilities. Check workflow permissions and GitHub API status."
            }
          fi
        done

