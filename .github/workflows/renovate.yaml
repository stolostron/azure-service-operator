name: Renovate

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Use 'full' to preview without creating PRs; 'false' runs normally and may create or update PRs."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "full"

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      app_configured: ${{ steps.check.outputs.app_configured }}
    steps:
      - name: Check Renovate GitHub App configuration
        id: check
        env:
          RENOVATE_APP_ID: ${{ secrets.RENOVATE_APP_ID }}
          RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$RENOVATE_APP_ID" && -n "$RENOVATE_APP_PRIVATE_KEY" ]]; then
            echo "app_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_configured=false" >> "$GITHUB_OUTPUT"
          fi

  renovate-app:
    needs: configuration
    if: needs.configuration.outputs.app_configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Create Renovate GitHub App token
        id: renovate-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: azure-service-operator
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - uses: renovatebot/github-action@693b9ef15eec82123529a37c782242f091365961 # v46.1.14
        with:
          token: ${{ steps.renovate-app-token.outputs.token }}
          configurationFile: renovate.json
        env:
          LOG_LEVEL: info
          RENOVATE_DRY_RUN: ${{ github.event.inputs['dry-run'] || 'false' }}

  renovate-fallback:
    needs: configuration
    if: needs.configuration.outputs.app_configured != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Warn when Renovate GitHub App credentials are missing
        run: echo "::warning::Set RENOVATE_APP_ID and RENOVATE_APP_PRIVATE_KEY to enable Dependabot alert access and native pull_request workflows."

      - uses: renovatebot/github-action@693b9ef15eec82123529a37c782242f091365961 # v46.1.14
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          configurationFile: renovate.json
        env:
          LOG_LEVEL: info
          RENOVATE_DRY_RUN: ${{ github.event.inputs['dry-run'] || 'false' }}

      - name: Dispatch security scans for Renovate PRs
        if: github.event.inputs['dry-run'] != 'full'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pull_requests=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label dependencies \
            --author 'github-actions[bot]' \
            --limit 1000 \
            --json number,baseRefName \
            --jq '.[] | [.number, .baseRefName] | @tsv')

          while IFS=$'\t' read -r pr_number base_branch; do
            [[ -n "$pr_number" && -n "$base_branch" ]] || continue
            gh workflow run daily-security-scan.yaml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              --field pr_number="$pr_number" \
              --field base_branch="$base_branch"
          done <<< "$pull_requests"
